services:
  relay:
    image: caddy:2.10-alpine
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN:?RELAY_DOMAIN is required}"
      UPSTREAM_HOST: "${UPSTREAM_HOST:?UPSTREAM_HOST is required}"
      UPSTREAM_ORIGIN: "${UPSTREAM_ORIGIN:?UPSTREAM_ORIGIN is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
