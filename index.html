<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3efe5" />
    <meta name="description" content="Онлайн-уроки Высшей школы собак" />
    <title>Высшая школа собак</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app { min-height: 100%; margin: 0; }
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .initial-loader { min-height: 100dvh; display: grid; place-content: center; place-items: center; gap: 14px; background: #fff; }
      .initial-loader__spinner { width: 32px; height: 32px; border: 3px solid rgba(17,80,161,.16); border-top-color: #1150a1; border-radius: 50%; animation: spin .7s linear infinite; }
      .initial-loader__label { margin: 0; color: #607086; font-size: 14px; font-weight: 600; }
      .access-gate { min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; background: radial-gradient(circle at 50% 8%, rgba(74,145,229,.2), transparent 42%), linear-gradient(180deg,#f8fbff,#eef5fc); }
      .access-gate__card { width: min(100%,420px); padding: 36px 28px 30px; border: 1px solid rgba(17,80,161,.1); border-radius: 28px; background: rgba(255,255,255,.94); box-shadow: 0 22px 60px rgba(26,74,123,.14); text-align: center; }
      .access-gate__mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 22px; background: #e9f3ff; font-size: 30px; }
      .access-gate__eyebrow { margin: 0 0 8px; color: #3777bf; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .access-gate h1 { margin: 0; color: #17324f; font-size: clamp(25px,7vw,32px); line-height: 1.12; }
      .access-gate__message { max-width: 330px; margin: 16px auto 0; color: #607086; font-size: 15px; line-height: 1.55; }
      .access-gate__actions { display: grid; gap: 10px; margin-top: 26px; }
      .access-gate__actions:empty { display: none; }
      .access-gate__button { min-height: 50px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border: 0; border-radius: 16px; background: #1150a1; color: #fff; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
      .access-gate__button:focus-visible { outline: 3px solid rgba(17,80,161,.28); outline-offset: 3px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
