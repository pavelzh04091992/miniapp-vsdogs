name: miniapp-puppys

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6
    profiles: [production]
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${LETSENCRYPT_PATH:-./letsencrypt}:/letsencrypt"
    depends_on:
      gateway:
        condition: service_healthy
    networks: [proxy]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    init: true
    environment:
      NODE_ENV: production
      LOCKED_MODE: "${LOCKED_MODE:-true}"
      APP_SERVER_PORT: "8787"
      ADMIN_TELEGRAM_ID: "${ADMIN_TELEGRAM_ID:-}"
      AUTH_DATABASE_PATH: "/app/data/auth.sqlite"
      BOT_TOKEN: "${BOT_TOKEN:-}"
      BOT_USERNAME: "${BOT_USERNAME:-}"
      BOT_STATE_TTL_SECONDS: "${BOT_STATE_TTL_SECONDS:-600}"
      DEFAULT_VIDEO_SITUATION_SLUG: "${DEFAULT_VIDEO_SITUATION_SLUG:-puppy-toilet-home}"
      INVITE_TTL_SECONDS: "${INVITE_TTL_SECONDS:-86400}"
      MAGIC_LINK_TTL_SECONDS: "${MAGIC_LINK_TTL_SECONDS:-600}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      AUTH_RATE_LIMIT_MAX: "${AUTH_RATE_LIMIT_MAX:-20}"
      MAGIC_LINK_RATE_LIMIT_MAX: "${MAGIC_LINK_RATE_LIMIT_MAX:-30}"
      BOT_COMMAND_RATE_LIMIT_MAX: "${BOT_COMMAND_RATE_LIMIT_MAX:-40}"
      FEEDBACK_RATE_LIMIT_MAX: "${FEEDBACK_RATE_LIMIT_MAX:-4}"
      FEEDBACK_RATE_LIMIT_WINDOW_SECONDS: "${FEEDBACK_RATE_LIMIT_WINDOW_SECONDS:-600}"
      KNOWN_VIDEO_SITUATION_SLUGS: "${KNOWN_VIDEO_SITUATION_SLUGS:-puppy-toilet-home}"
      MINI_APP_URL: "${MINI_APP_URL:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      PUBLIC_CHANNEL_ID: "${PUBLIC_CHANNEL_ID:-}"
      PUBLIC_CHANNEL_USERNAME: "${PUBLIC_CHANNEL_USERNAME:-}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-__Host-miniapp_session}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      SESSION_COOKIE_SAME_SITE: "${SESSION_COOKIE_SAME_SITE:-None}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-604800}"
      SUBSCRIPTION_WARNING_SECONDS: "${SUBSCRIPTION_WARNING_SECONDS:-259200}"
      SUBSCRIPTION_SWEEP_INTERVAL_SECONDS: "${SUBSCRIPTION_SWEEP_INTERVAL_SECONDS:-300}"
      TELEGRAM_WEBHOOK_PATH: "${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}"
      TELEGRAM_WEBHOOK_PUBLIC_BASE_URL: "${TELEGRAM_WEBHOOK_PUBLIC_BASE_URL:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: "${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-900}"
      TELEGRAM_EGRESS_MODE: "${TELEGRAM_EGRESS_MODE:-direct}"
      TELEGRAM_PROXY_URL: "${TELEGRAM_PROXY_URL:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      WEBHOOK_MAX_BODY_BYTES: "${WEBHOOK_MAX_BODY_BYTES:-1048576}"
    expose: ["8787"]
    volumes:
      - "${DATA_PATH:-./data}:/app/data:rw"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      backend:
        aliases: [app-backend]
      egress: {}
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    stop_grace_period: 15s
    restart: unless-stopped

  media:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - "./infra/media-nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${MEDIA_PATH:-./media}:/usr/share/nginx/html/media:ro"
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/media-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      backend:
        aliases: [media-backend]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
      media:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${LOCAL_APP_PORT:-8080}:80"
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=${PROXY_NETWORK_NAME:-miniapp-puppys_proxy}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-miniapp}.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-miniapp}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-miniapp}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-miniapp}.priority=10"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-miniapp}.middlewares=${TRAEFIK_MIDDLEWARE_NAME:-miniapp-security-headers}@docker"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-miniapp}.service=${TRAEFIK_SERVICE_NAME:-miniapp}"
      - "traefik.http.services.${TRAEFIK_SERVICE_NAME:-miniapp}.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${TRAEFIK_MIDDLEWARE_NAME:-miniapp-security-headers}.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.${TRAEFIK_MIDDLEWARE_NAME:-miniapp-security-headers}.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.${TRAEFIK_MIDDLEWARE_NAME:-miniapp-security-headers}.headers.permissionspolicy=camera=(), microphone=(), geolocation=(), payment=()"
      - "traefik.http.middlewares.${TRAEFIK_MIDDLEWARE_NAME:-miniapp-security-headers}.headers.stsseconds=31536000"
      - "traefik.http.middlewares.${TRAEFIK_MIDDLEWARE_NAME:-miniapp-security-headers}.headers.stsincludesubdomains=true"
    volumes:
      - "./infra/local-gateway-nginx.conf:/etc/nginx/nginx.conf:ro"
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      backend: {}
      proxy: {}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: miniapp-admin-panel
    restart: unless-stopped
    volumes:
      - "${DATA_PATH:-./data}:/data:rw"
    environment:
      - NODE_ENV=production
      - ADMIN_PORT=3000
      - DB_PATH=/data/auth.sqlite
      - BOT_TOKEN=${BOT_TOKEN:-}
      - TELEGRAM_EGRESS_HOST=telegram-egress
    networks:
      - proxy
      - egress
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK_NAME:-miniapp-puppys_proxy}"
      - "traefik.http.routers.admin.rule=Host(`admin.miniapp-vsdogs.ru`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"

networks:
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  proxy:
    name: "${PROXY_NETWORK_NAME:-miniapp-puppys_proxy}"
    external: ${PROXY_NETWORK_EXTERNAL:-false}
