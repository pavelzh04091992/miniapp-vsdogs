name: miniapp-puppys

services:
  traefik:
    image: traefik:v3.6
    container_name: miniapp-traefik
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - proxy
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
      args:
        VITE_MINI_APP_LINK: ${VITE_MINI_APP_LINK}
        VITE_TEST_RUTUBE_VIDEO_URL: ${VITE_TEST_RUTUBE_VIDEO_URL}
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=miniapp-puppys_proxy"
      - "traefik.http.routers.miniapp.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.miniapp.entrypoints=websecure"
      - "traefik.http.routers.miniapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.miniapp.loadbalancer.server.port=8787"
    volumes:
      - "./data:/app/public/data"
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
